[workspace]
name = "jupyterlite-build"
description = "Builds the JupyterLite static site from demo.ipynb — see ../.github/workflows/deploy.yml."
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
jupyterlite-core = "0.8.3.*"
jupyter_server = "2.21.0.*"
pip = "*"

[pypi-dependencies]
# conda-forge only has 5.0.0; pinned to the newer 5.1.0 (PyPI) here since
# it's the more current, better-supported release -- note this did NOT fix
# the kernel-registration bug below (confirmed identical on both versions).
jupyterlite-xeus = "==5.1.0"

[tasks]
# --XeusAddon.prefix points at the *already-assembled* ../demo_env (see
# ../demo_env_build) rather than having jupyterlite-xeus solve its own
# emscripten-wasm32 environment from scratch: demo_env already has
# xeus-python installed alongside the real rclpy/rmw_zenoh_pico/zenoh-pico
# stack (see demo_env_build/pixi.toml.in) -- a completely stock, no-pthreads
# xeus-python build (see ../README.md#what-it-took-to-get-rclpy-working) --
# so the notebook kernel and the browser_demo talkers share one built
# environment instead of resolving/downloading the same closure twice.
#
# The kernel itself is confirmed working end-to-end (Node() construction
# with retry, publisher/subscriber, and a clean rclpy.shutdown() all run
# real cells through it -- see demo.ipynb and its own git history), so this
# is NOT the "kernel never actually runs" state the note below originally
# described. What's still unresolved as of 2026-09-14: the JupyterLite
# launcher/kernel-picker UI can still show only "No Kernel" in at least
# some browser/automation contexts, even though the exact same build works
# when the Jupyter protocol is driven directly (bypassing the picker --
# see ../scratch/jupyterlite_env_test/browser_test.html) or, per informal
# reports, in normal interactive use. The original root-cause trace below
# (from 2026-09-12, before the kernel itself was confirmed working) is kept
# for whoever picks this up, but treat it as a lead on the picker-UI bug
# specifically, not a description of the kernel's current state.
#
# Original trace: the registration plugin's activate() runs, kernels.json
# fetches correctly, and kernelspecs.register(...) is called without error
# -- but a direct identity check (`t === app.serviceManager.kernelspecs`
# inside the plugin) returns false. The IKernelSpecs instance the plugin
# receives is a *different object* than the one JupyterLab's UI actually
# reads from -- a classic webpack Module Federation shared-singleton
# mismatch. Confirmed identical on jupyterlite-xeus 5.0.0 (conda-forge) and
# 5.1.0 (PyPI), so it isn't a simple version-skew bug with a known fix.
# Also confirmed NOT caused by --XeusAddon.prefix pointing at a symlink or
# a non-conda-managed prefix: demo_env is already a real pixi-managed
# environment (a symlink to demo_env_build/.pixi/envs/default, which has a
# full conda-meta db), and pointing directly at the resolved path made no
# difference. The alternative --XeusAddon.environment_file build path was
# also tried, but jupyterlite-xeus's own micromamba wrapper doesn't expose
# a channel-priority setting, and ros2-rclpy's pyyaml dependency needs
# channel-priority disabled to solve against this project's local channel
# -- neither a MAMBARC env var nor a project-local .mambarc were picked up
# by the subprocess, so that path never got far enough to test.
# Next step, if resumed: either patch the built webpack shared-scope
# config directly, or file an upstream jupyterlite/xeus issue with this
# repro (the identity-check instrumentation above is the fastest way to
# confirm/deny the same root cause in a fresh build).
# The trailing flatten_runtime_only_plugins.py call fixes a real 404 on
# librcl_logging_noop.so in the live deployed kernel -- see that script's
# own header comment for the full explanation (jupyterlite-xeus's eager
# preload only discovers packages reachable via the dependency graph,
# which this one -- an env-var-selected runtime plugin, not a declared
# dependency of anything -- never is).
build = { cmd = "jupyter lite init && jupyter lite build --contents content --XeusAddon.prefix=../demo_env --XeusAddon.default_channels='[\"https://repo.prefix.dev/emscripten-forge-4x\",\"https://repo.prefix.dev/conda-forge\"]' && python3 ../.github/scripts/flatten_runtime_only_plugins.py ../demo_env _output/extensions/@jupyterlite/xeus-extension/static" }
