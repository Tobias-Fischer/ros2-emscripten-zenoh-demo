[workspace]
name = "jupyterlite-build"
description = "Builds the JupyterLite static site from demo.ipynb — see ../.github/workflows/deploy.yml."
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
jupyterlite-core = "0.8.3.*"
jupyter_server = "2.21.0.*"
pip = "*"

[pypi-dependencies]
# conda-forge only has 5.0.0; pinned to the newer 5.1.0 (PyPI) here since
# it's the more current, better-supported release -- note this did NOT fix
# the kernel-registration bug below (confirmed identical on both versions).
jupyterlite-xeus = "==5.1.0"

[tasks]
# --XeusAddon.prefix points at the *already-assembled* ../demo_env (see
# ../demo_env_build) rather than having jupyterlite-xeus solve its own
# emscripten-wasm32 environment from scratch: demo_env already has
# xeus-python installed alongside the real rclpy/rmw_zenoh_pico/zenoh-pico
# stack (see demo_env_build/pixi.toml.in), pthreads-python and all, so the
# notebook kernel and the browser_demo talkers share one built environment
# instead of resolving/downloading the same closure twice.
#
# KNOWN BUG (unresolved, 2026-09-12): the xpython kernel never shows up in
# the JupyterLite launcher/kernel-picker, even though the build completes
# cleanly and the kernel's files (kernels.json, kernel.json, the packaged
# .so's) all fetch successfully at runtime. Traced with injected
# instrumentation directly into the built @jupyterlite/xeus-extension
# bundle: the registration plugin's activate() runs, kernels.json fetches
# correctly, and kernelspecs.register(...) is called without error -- but
# a direct identity check (`t === app.serviceManager.kernelspecs` inside
# the plugin) returns false. The IKernelSpecs instance the plugin receives
# is a *different object* than the one JupyterLab's UI actually reads
# from -- a classic webpack Module Federation shared-singleton mismatch.
# Confirmed identical on jupyterlite-xeus 5.0.0 (conda-forge) and 5.1.0
# (PyPI), so it isn't a simple version-skew bug with a known fix. Also
# confirmed NOT caused by --XeusAddon.prefix pointing at a symlink or a
# non-conda-managed prefix: demo_env is already a real pixi-managed
# environment (a symlink to demo_env_build/.pixi/envs/default, which has
# a full conda-meta db), and pointing directly at the resolved path made
# no difference. The alternative --XeusAddon.environment_file build path
# was also tried, but jupyterlite-xeus's own micromamba wrapper doesn't
# expose a channel-priority setting, and ros2-rclpy's pyyaml dependency
# needs channel-priority disabled to solve against this project's local
# channel -- neither a MAMBARC env var nor a project-local .mambarc were
# picked up by the subprocess, so that path never got far enough to test.
# Next step, if resumed: either patch the built webpack shared-scope
# config directly, or file an upstream jupyterlite/xeus issue with this
# repro (the identity-check instrumentation above is the fastest way to
# confirm/deny the same root cause in a fresh build).
build = { cmd = "jupyter lite init && jupyter lite build --contents content --XeusAddon.prefix=../demo_env --XeusAddon.default_channels='[\"https://repo.prefix.dev/emscripten-forge-4x\",\"https://repo.prefix.dev/conda-forge\"]'" }
