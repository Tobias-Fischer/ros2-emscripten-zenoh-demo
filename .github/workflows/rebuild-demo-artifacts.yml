name: Rebuild demo artifacts from source

# Rebuilds site/assets/ (the two live wasm32 talkers) from scratch: the full
# ros-rolling emscripten-wasm32 + rmw_zenoh_pico recipe closure, the
# pthreads-patched CPython + numpy, then the final em++ link step — all via
# pixi/rattler-build, no micromamba. Manual trigger only: a cold run builds
# ~230 packages from source and can take hours even with caching, so this
# should not run on every push. See the repo README for the manual
# alternative if you'd rather just copy artifacts in by hand.
#
# On success, commits the rebuilt site/assets/ to main, which triggers
# pages.yml to redeploy.

on:
  workflow_dispatch:
    inputs:
      ros_rolling_ref:
        description: "ros-rolling branch/ref to build (fork:branch)"
        default: "Tobias-Fischer/ros-rolling@feature/emscripten-wasm32-zenoh-pico"
        required: false
      recipes_ref:
        description: "emscripten-forge-recipes branch/ref (pthreads python/numpy)"
        default: "Tobias-Fischer/emscripten-forge-recipes@wasm-pthreads-python-numpy-orphan"
        required: false

jobs:
  build-python-numpy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Parse recipes_ref
        id: ref
        run: |
          ref="${{ inputs.recipes_ref }}"
          echo "repo=${ref%@*}" >> "$GITHUB_OUTPUT"
          echo "branch=${ref#*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.ref.outputs.repo }}
          ref: ${{ steps.ref.outputs.branch }}
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: rattler-build-env
      - name: Build pthreads python (wasm32)
        run: pixi run -e rattler-build-env build-emscripten-wasm32-pkg recipes/recipes_emscripten/python
      - name: Build pthreads numpy (wasm32)
        run: pixi run -e rattler-build-env build-emscripten-wasm32-pkg recipes/recipes_emscripten/numpy
      - uses: actions/upload-artifact@v4
        with:
          name: emscripten-forge-recipes-output
          path: output/
          retention-days: 7

  build-ros-packages:
    needs: build-python-numpy
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Parse ros_rolling_ref
        id: ref
        run: |
          ref="${{ inputs.ros_rolling_ref }}"
          echo "repo=${ref%@*}" >> "$GITHUB_OUTPUT"
          echo "branch=${ref#*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.ref.outputs.repo }}
          ref: ${{ steps.ref.outputs.branch }}
      - uses: prefix-dev/setup-pixi@v0.10.2
      - uses: actions/download-artifact@v4
        with:
          name: emscripten-forge-recipes-output
          path: /tmp/emscripten_forge_recipes/output
      # The bulk of the work: ~230 packages, cached by content hash so only
      # genuinely-changed recipes rebuild on subsequent runs (--skip-existing
      # in the task itself; this cache just avoids re-fetching/re-extracting
      # everything that's already built).
      - uses: actions/cache@v4
        with:
          path: output/
          key: ros-rolling-emscripten-output-${{ hashFiles('recipes/**', 'patch/**', 'vinca.yaml', 'robostack.yaml', 'pkg_additional_info.yaml', 'rosdistro_snapshot.yaml') }}
          restore-keys: |
            ros-rolling-emscripten-output-
      - name: Build the full emscripten-wasm32 + rmw_zenoh_pico closure
        run: pixi run build-emscripten
      # rosidl_typesupport_microxrcedds_cpp's codegen gap (see README's
      # Known limitations): these 3 packages need the C-only typesupport
      # backend specifically for rmw_zenoh_pico, which the single global
      # env var above can't express — rebuilt here with --skip-existing
      # none to force it, same invocation documented in demo_env.md.
      - name: Rebuild rcl_interfaces/type_description_interfaces/service_msgs (C-only typesupport)
        env:
          VINCA_EMSCRIPTEN_RMW_IMPLEMENTATION: rmw_zenoh_pico
          VINCA_EMSCRIPTEN_STATIC_TYPESUPPORT_C: rosidl_typesupport_microxrcedds_c
        run: |
          for pkg in rcl-interfaces type-description-interfaces service-msgs; do
            pixi run rattler-build build \
              --package-format tar-bz2 \
              --recipe "./recipes/ros2-${pkg}/recipe.yaml" \
              -m ./conda_build_config.yaml \
              -c https://repo.prefix.dev/conda-forge \
              -c https://repo.prefix.dev/emscripten-forge-4x \
              -c file:///tmp/emscripten_forge_recipes/output \
              -c microsoft -c robostack-staging \
              --target-platform emscripten-wasm32 \
              --skip-existing none --test skip --channel-priority disabled
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ros-rolling-emscripten-output
          path: output/emscripten-wasm32/
          retention-days: 7

  assemble-and-build-talkers:
    needs: [build-python-numpy, build-ros-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
      - uses: actions/download-artifact@v4
        with:
          name: ros-rolling-emscripten-output
          path: /tmp/ros-rolling-output/emscripten-wasm32
      - uses: actions/download-artifact@v4
        with:
          name: emscripten-forge-recipes-output
          path: /tmp/emscripten-forge-recipes-output
      - name: Assemble demo_env
        env:
          ROS_ROLLING_OUTPUT: /tmp/ros-rolling-output
          EMSCRIPTEN_FORGE_OUTPUT: /tmp/emscripten-forge-recipes-output
        run: ./demo_env_build/build.sh
      - name: Build both talkers
        working-directory: browser_demo
        run: |
          pixi run build-rclc
          pixi run build-rclpy
      - name: Copy build output into site/assets
        run: |
          rm -rf site/assets
          mkdir -p site/assets
          find browser_demo/out -maxdepth 1 -type f ! -name '*.html' -exec cp {} site/assets/ \;
      - name: Commit rebuilt artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/assets
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "ci: rebuild site/assets from source ($(date -u +%Y-%m-%d))"
          git push
