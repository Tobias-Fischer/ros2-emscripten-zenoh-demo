  <h1>GPS demo</h1>
  <p class="lede">Publishes your browser's location as <code>sensor_msgs/NavSatFix</code> on <code>gps/fix</code>. Grant location access when prompted — best tried on a phone.</p>
  <div class="panel">
    <pre id="log"></pre>
  </div>
  <footer>wasm32 · rclc · rmw_zenoh_pico — part of <a href="https://github.com/Tobias-Fischer/ros2-emscripten-zenoh-demo">ros2-emscripten-zenoh-demo</a></footer>
</div>
<script>
  const logEl = document.getElementById('log');
  // Emscripten's own dylib-loading watchdog fires every ~10s while any of
  // this page's ~90 .so files (the full transitive ROS 2 core dependency
  // graph, not just what this page's own code needs) are still in flight --
  // completely normal on a slow connection, not a crash, but its raw 3-line
  // block reads like one if shown immediately and repeated every tick. See
  // printErr below.
  let dylibWaitTicks = 0;
  let dylibNoticeShown = false;
  var Module = {
    print: (t) => { console.log(t); logEl.textContent += t + "\n"; },
    printErr: (t) => {
      console.error(t);
      if (t.startsWith("still waiting on run dependencies") || t.startsWith("dependency: ") || t === "(end of list)") {
        if (t.startsWith("still waiting on run dependencies")) {
          dylibWaitTicks++;
          if (dylibWaitTicks >= 3 && !dylibNoticeShown) {
            dylibNoticeShown = true;
            logEl.textContent += "[info] still loading dependencies -- this can take a while on a slow connection\n";
          }
        }
        return;
      }
      logEl.textContent += "[err] " + t + "\n";
    },
    // See index_rclc.html for why this is needed.
    websocket: { subprotocol: null },
  };

  // Same shared-memory pattern as index_teleop.html: main() runs on a
  // pthread Web Worker with no window/DOM/Geolocation access, so
  // navigator.geolocation lives here on the page's real main thread,
  // writing straight into wasm linear memory at the address
  // gps_get_state_ptr() exports once the runtime is ready. See
  // gps_rclc.c for the struct layout (latitude, longitude, altitude,
  // has_fix -- in that order, all but has_fix a double).
  Module.onRuntimeInitialized = () => {
    const statePtr = Module.ccall('gps_get_state_ptr', 'number', [], []);
    const latIndex = statePtr >> 3;
    const lonIndex = latIndex + 1;
    const altIndex = latIndex + 2;
    // has_fix is a 32-bit int right after three doubles (24 bytes in).
    const hasFixIndex = (statePtr + 24) >> 2;

    if (!navigator.geolocation) {
      logEl.textContent += "[err] navigator.geolocation not available in this browser\n";
      return;
    }

    navigator.geolocation.watchPosition(
      (position) => {
        const c = position.coords;
        Module.HEAPF64[latIndex] = c.latitude;
        Module.HEAPF64[lonIndex] = c.longitude;
        Module.HEAPF64[altIndex] = (c.altitude === null) ? NaN : c.altitude;
        Module.HEAP32[hasFixIndex] = 1;
        console.log('gps: fix', c.latitude, c.longitude, c.altitude);
      },
      (err) => {
        logEl.textContent += "[err] geolocation: " + err.message + "\n";
      },
      { enableHighAccuracy: false, maximumAge: 5000, timeout: 30000 }
    );
    console.log('gps: watchPosition installed, waiting for a fix');
  };
</script>
<script src="gps_rclc.js"></script>
