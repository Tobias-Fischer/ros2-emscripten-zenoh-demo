  <h1>rclc talker</h1>
  <p class="lede">The minimal-footprint path: <code>rclc</code>, plain C, no interpreter — publishes <code>std_msgs/String</code> on <code>chatter</code> once a second.</p>
  <div class="panel">
    <pre id="log"></pre>
  </div>
  <footer>wasm32 · rclc · rmw_zenoh_pico — part of <a href="https://github.com/Tobias-Fischer/ros2-emscripten-zenoh-demo">ros2-emscripten-zenoh-demo</a></footer>
</div>
<script>
  const logEl = document.getElementById('log');
  var Module = {
    print: (t) => { console.log(t); logEl.textContent += t + "\n"; },
    printErr: (t) => { console.error(t); logEl.textContent += "[err] " + t + "\n"; },
    // zenohd's ws/ listener does a plain upgrade with no Sec-WebSocket-Protocol
    // negotiation. Emscripten's socket layer defaults to requesting the
    // "binary" subprotocol; RFC 6455 requires a client to fail the connection
    // if the server doesn't echo back a subprotocol it offered, which real
    // browsers enforce (curl does not, which is why a plain curl handshake
    // looked fine). subprotocol: null skips requesting one entirely.
    websocket: { subprotocol: null },
  };
</script>
<script src="talker_rclc.js"></script>
