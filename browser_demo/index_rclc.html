<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>wasm32 rclc talker — ROS 2 in WebAssembly</title>
<link rel="stylesheet" href="demo-page.css" />
</head>
<body>
<div class="wrap">
  <nav class="demo-nav">
    <a href="index_rclc.html" class="current">rclc talker</a>
    <a href="index_rclpy.html">rclpy talker</a>
    <a href="index_teleop.html">keyboard teleop</a>
    <a href="index_imu.html">phone tilt</a>
    <a href="index_gps.html">GPS</a>
    <a href="index_camera.html">camera</a>
    <a href="robot_view.html">virtual robot</a>
  </nav>
  <div class="router-config">
    <label>zenoh router:</label>
    <input type="text" data-field="host" placeholder="127.0.0.1">
    <span>:</span>
    <input type="text" data-field="port" placeholder="7447">
    <label><input type="checkbox" data-field="tls"> wss (TLS)</label>
    <button type="button" data-router-apply>Apply &amp; reload</button>
  </div>
  <h1>rclc talker</h1>
  <p class="lede">The minimal-footprint path: <code>rclc</code>, plain C, no interpreter — publishes <code>std_msgs/String</code> on <code>chatter</code> once a second.</p>
  <div class="panel">
    <pre id="log"></pre>
  </div>
  <footer>wasm32 · rclc · rmw_zenoh_pico — part of <a href="https://github.com/Tobias-Fischer/ros2-emscripten-zenoh-demo">ros2-emscripten-zenoh-demo</a></footer>
</div>
<script>
  const logEl = document.getElementById('log');
  // Emscripten's own dylib-loading watchdog fires every ~10s while any of
  // this page's ~90 .so files (the full transitive ROS 2 core dependency
  // graph, not just what this page's own code needs) are still in flight --
  // completely normal on a slow connection, not a crash, but its raw 3-line
  // block reads like one if shown immediately and repeated every tick. See
  // printErr below.
  let dylibWaitTicks = 0;
  let dylibNoticeShown = false;
  var Module = {
    print: (t) => { console.log(t); logEl.textContent += t + "\n"; },
    printErr: (t) => {
      console.error(t);
      if (t.startsWith("still waiting on run dependencies") || t.startsWith("dependency: ") || t === "(end of list)") {
        if (t.startsWith("still waiting on run dependencies")) {
          dylibWaitTicks++;
          if (dylibWaitTicks >= 3 && !dylibNoticeShown) {
            dylibNoticeShown = true;
            logEl.textContent += "[info] still loading dependencies -- this can take a while on a slow connection\n";
          }
        }
        return;
      }
      logEl.textContent += "[err] " + t + "\n";
    },
    // zenohd's ws/ listener does a plain upgrade with no Sec-WebSocket-Protocol
    // negotiation. Emscripten's socket layer defaults to requesting the
    // "binary" subprotocol; RFC 6455 requires a client to fail the connection
    // if the server doesn't echo back a subprotocol it offered, which real
    // browsers enforce (curl does not, which is why a plain curl handshake
    // looked fine). subprotocol: null skips requesting one entirely.
    websocket: { subprotocol: null },
  };

  // Runtime-configurable zenoh connect address: rmw_zenoh_pico's compiled-in
  // default (127.0.0.1:7447) is a *default*, overridden here via
  // rmw_zenoh_pico_set_unicast() (see talker_rclc.c) before main() opens the
  // session -- main() is linked with -sINVOKE_RUN=0 specifically so this can
  // run first. ?zenoh_host=/&zenoh_port= in the URL (or the fields above)
  // set it; leave both blank to use the compiled-in default.
  const zenohParams = new URLSearchParams(location.search);
  const zenohHost = zenohParams.get('zenoh_host') || '';
  const zenohPort = zenohParams.get('zenoh_port') || '';
  const zenohTls = zenohParams.get('zenoh_tls') === '1';
  document.querySelector('.router-config [data-field="host"]').value = zenohHost;
  document.querySelector('.router-config [data-field="port"]').value = zenohPort;
  document.querySelector('.router-config [data-field="tls"]').checked = zenohTls;
  document.querySelector('.router-config [data-router-apply]').addEventListener('click', () => {
    const host = document.querySelector('.router-config [data-field="host"]').value.trim();
    const port = document.querySelector('.router-config [data-field="port"]').value.trim();
    const tls = document.querySelector('.router-config [data-field="tls"]').checked;
    const params = new URLSearchParams();
    if (host) params.set('zenoh_host', host);
    if (port) params.set('zenoh_port', port);
    if (tls) params.set('zenoh_tls', '1');
    location.search = params.toString();
  });
  // A custom (non-default) host almost always means "someone else's device" --
  // mixed-content policy blocks a plain ws:// connection from this https:// page
  // to anything but 127.0.0.1/localhost anyway, so route it through the same
  // Module.websocket.url override emscripten's socket shim already supports
  // (SOCKFS.websocketArgs.url) rather than leaving it to silently fail. See the
  // main page's setup box for the Caddy one-liner that terminates TLS in front
  // of a plain zenohd.
  Module.websocket.url = zenohTls ? 'wss://' : 'ws://';

  Module.onRuntimeInitialized = () => {
    if (zenohHost) {
      Module.stringToUTF8(zenohHost, Module.ccall('zenoh_get_connect_host_buf', 'number', [], []), 64);
    }
    if (zenohPort) {
      Module.stringToUTF8(zenohPort, Module.ccall('zenoh_get_connect_port_buf', 'number', [], []), 8);
    }
    Module.callMain([]);
  };
</script>
<script src="talker_rclc.js"></script>
</body>
</html>
